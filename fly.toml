# fly.toml — Bot Boss backend on Fly.io
# Provision: fly launch --no-deploy && fly secrets set ... && fly deploy
# Secrets live in fly, NOT in this file. See DEPLOY.md for the full list.

app = "botboss-api"
primary_region = "sjc"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  APNS_ENVIRONMENT = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
